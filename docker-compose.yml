services:
    nopcommerce_web:
        build: .
        container_name: nopcommerce
        environment:
            - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
        ports:
            - "80:80"
        depends_on:
            - nopcommerce_database
            - otel-collector
        volumes:
            - nopcommerce_appdata:/app/App_Data
        extra_hosts:
            - "host.docker.internal:host-gateway"
        

    nopcommerce_database:
        image: "mcr.microsoft.com/mssql/server:2019-latest"
        container_name: nopcommerce_mssql_server
        environment:
            SA_PASSWORD: "nopCommerce_db_password"
            ACCEPT_EULA: "Y"
            MSSQL_PID: "Express"
        ports:
            - "1433:1433"
        volumes:
            - nopcommerce_data:/var/opt/mssql

    jaeger:
        image: jaegertracing/all-in-one
        container_name: jaeger_container
        environment:
            - COLLECTOR_OTLP_ENABLED=true
        ports:
            - "16686:16686" # Interface do Browser

    otel-collector:
        image: otel/opentelemetry-collector:latest
        container_name: otel_collector
        command: ["--config=/etc/otel-collector-config.yaml"]
        volumes:
            - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
        ports:
            - "4317:4317"   # OTLP gRPC receiver
            - "4318:4318"   # OTLP HTTP receiver
            - "8888:8888"   # Metrics about the collector itself
        depends_on:
            - jaeger

    prometheus:
        image: prom/prometheus:latest
        container_name: prometheus_container
        command:
            - --config.file=/etc/prometheus/prometheus.yml
            - --web.enable-otlp-receiver
        volumes:
            - ./prometheus.yml:/etc/prometheus/prometheus.yml
        ports:
            - "9090:9090"
        extra_hosts:
            - "host.docker.internal:host-gateway"

    grafana:
        image: grafana/grafana:latest
        container_name: grafana_container
        ports:
            - "3000:3000"
        depends_on:
            - prometheus
            - jaeger
        extra_hosts:
            - "host.docker.internal:host-gateway"
        volumes:
            - ./grafana/provisioning:/etc/grafana/provisioning
            - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  nopcommerce_data:
  nopcommerce_appdata: